name: worker

# Builds the RunPod separation worker image (runpod/Dockerfile) and pushes it to GHCR.
on:
  push:
    branches: [main, cloud-separation]
    paths:
      - runpod/**
      - src/countin/core/stems.py
      - src/countin/core/accel.py
      - src/countin/core/assets.py
      - src/countin/core/roformer/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/worker.yml
  workflow_dispatch:

jobs:
  # A push that only bumps the version builds the same image; nothing to push.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          run=true
          [ -z "$BASE" ] || run=$(.github/scripts/changed.sh "$BASE" "$GITHUB_SHA" runpod src/countin/core/stems.py \
            src/countin/core/accel.py src/countin/core/assets.py src/countin/core/roformer pyproject.toml uv.lock \
            .github/workflows/worker.yml)
          echo "run=$run" >> "$GITHUB_OUTPUT"

  image:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # torch with CUDA makes an image of several GB; the runner's preinstalled SDKs leave too little disk.
      - name: free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - uses: actions/cache@v6
        with:
          path: models
          key: models-${{ hashFiles('packaging/fetch_models.sh') }}
      - run: packaging/fetch_models.sh

      - name: build and push
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/count-in-worker
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          tag="sha-${GITHUB_SHA::7}"
          docker buildx build --platform linux/amd64 -f runpod/Dockerfile \
            -t "$IMAGE:$tag" -t "$IMAGE:${GITHUB_REF_NAME//\//-}" --push .
          echo "pushed $IMAGE:$tag" >> "$GITHUB_STEP_SUMMARY"
