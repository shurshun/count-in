name: gpu-bench

# Dev build: one Windows exe that times the separation model on the CPU and on the GPU (DirectML).
# Runs on pushes to the prototype branch (a workflow_dispatch workflow must live on main first).
on:
  push:
    branches: [onnx-directml-prototype]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # setup-uv publishes exact version tags only
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/cache@v6
        with:
          path: models
          key: models-${{ hashFiles('packaging/fetch_models.sh') }}
      - run: packaging/fetch_models.sh

      - name: export the model core to ONNX
        run: uv run --with onnx --with onnxscript --with onnxruntime-directml python prototypes/onnx/export.py

      - name: build one exe
        run: |
          uv run --with onnxruntime-directml --with pyinstaller pyinstaller --onefile --console --noconfirm \
            --name count-in-gpu-bench --collect-binaries onnxruntime \
            --add-data "models/roformer-core.onnx;." prototypes/onnx/gpu_bench.py

      # The runner has no GPU: this only proves the exe starts and the CPU path works
      - name: smoke test
        run: dist/count-in-gpu-bench.exe --runs 1 --no-pause

      - uses: actions/upload-artifact@v7
        with:
          path: dist/count-in-gpu-bench.exe
          archive: false
