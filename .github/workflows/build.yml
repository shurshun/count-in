name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Count-In-windows-x64
          - os: macos-latest
            name: Count-In-macos-arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      # LGPL builds only: libmp3lame is LGPL, nothing GPL goes into the bundle.
      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: |
          curl -fsSL -o ff.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-lgpl-8.1.zip
          7z x -y ff.zip > /dev/null
          mkdir -p bin
          cp ffmpeg-*/bin/ffmpeg.exe ffmpeg-*/bin/ffprobe.exe bin/
          cp ffmpeg-*/LICENSE.txt bin/FFMPEG-LICENSE.txt
          bin/ffmpeg.exe -hide_banner -encoders | grep -q libmp3lame
      - name: ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install lame mpg123 && packaging/build_ffmpeg.sh

      - run: uv sync --locked
      - run: uv run pytest -m 'not slow' -q

      - uses: actions/cache@v4
        with:
          path: models
          key: models-final0-bsroformer-sw
      - run: packaging/fetch_models.sh

      - run: uv run pyinstaller packaging/countin-app.spec --noconfirm --distpath dist --workpath build/work

      # Smoke test of the frozen code: 20 s of clicks at 120 BPM through detection, separation and mp3 export.
      - name: smoke test
        run: |
          uv run pyinstaller packaging/countin.spec --noconfirm --distpath smoke --workpath build/smoke
          uv run python -c "import numpy as np, soundfile as sf; sr=44100; x=np.zeros((20*sr,2),np.float32); [x.__setitem__(slice(int(t*sr),int(t*sr)+400), 0.8) for t in np.arange(1,20,0.5)]; sf.write('smoke.wav', x, sr)"
          smoke/countin/countin smoke.wav --guitar-db=-12 --format mp3 --out smoke_out.mp3
          test -s smoke_out.mp3
      - name: pack
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            (cd dist && 7z a -tzip -mx=5 "../${{ matrix.name }}.zip" Count-In > /dev/null)
          else
            ditto -c -k --keepParent dist/Count-In.app "${{ matrix.name }}.zip"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.zip
          compression-level: 0
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}.zip
