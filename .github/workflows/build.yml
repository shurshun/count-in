name: Publish Count-In dev artifacts
on:
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - name: Upload existing dev119 bundles to the public prerelease
        run: |
          set -euo pipefail
          mac_zip=Count-In-dev-0.10.1.dev119-macos-arm64.zip
          win_zip=Count-In-dev-0.10.1.dev119-windows-x64.zip
          gh api "repos/$GH_REPO/actions/artifacts/14639953793/zip" > "$mac_zip" &
          mac_pid=$!
          gh api "repos/$GH_REPO/actions/artifacts/14642425260/zip" > "$win_zip" &
          win_pid=$!
          wait "$mac_pid"
          wait "$win_pid"
          gh release upload dev-0.10.0-1 "$mac_zip" "$win_zip"
          gh release edit dev-0.10.0-1 --title 'Count-In dev 0.10.1.dev119' --notes-file .github/dev-release-notes.md --prerelease --latest=false
          gh release view dev-0.10.0-1 --json name,url,isPrerelease,assets --jq '{name,url,isPrerelease,assets:[.assets[]|select(.name|contains("dev119"))|.url]}'
