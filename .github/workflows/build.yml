name: build

# PRs check every code change; tags publish a release. Docs-only changes skip the build.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Count-In-windows-x64
            cli: dist/Count-In/countin
          - os: macos-latest
            name: Count-In-macos-arm64
            cli: dist/Count-In.app/Contents/MacOS/countin
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      # LGPL builds only: libmp3lame is LGPL, nothing GPL goes into the bundle.
      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: |
          curl -fsSL -o ff.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-lgpl-8.1.zip
          7z x -y ff.zip > /dev/null
          mkdir -p bin
          cp ffmpeg-*/bin/ffmpeg.exe ffmpeg-*/bin/ffprobe.exe bin/
          cp ffmpeg-*/LICENSE.txt bin/FFMPEG-LICENSE.txt
          bin/ffmpeg.exe -hide_banner -encoders | grep -q libmp3lame
      - name: ffmpeg cache (macOS)
        if: runner.os == 'macOS'
        id: ffmpeg-cache
        uses: actions/cache@v6
        with:
          path: bin
          key: ffmpeg-macos-${{ hashFiles('packaging/build_ffmpeg.sh') }}
      - name: ffmpeg (macOS)
        if: runner.os == 'macOS' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: brew install lame mpg123 && packaging/build_ffmpeg.sh

      - run: uv sync --locked
      - run: uv run pytest -m 'not slow' -q

      - uses: actions/cache@v6
        with:
          path: models
          key: models-final0-bsroformer-sw
      - run: packaging/fetch_models.sh

      - run: uv run pyinstaller packaging/countin.spec --noconfirm --distpath dist --workpath build/work

      # Smoke test of the shipped bundle: 20 s of clicks at 120 BPM through detection, separation and mp3 export.
      - name: smoke test
        run: |
          uv run python -c "import numpy as np, soundfile as sf; sr=44100; x=np.zeros((20*sr,2),np.float32); [x.__setitem__(slice(int(t*sr),int(t*sr)+400), 0.8) for t in np.arange(1,20,0.5)]; sf.write('smoke.wav', x, sr)"
          ${{ matrix.cli }} --version
          ${{ matrix.cli }} smoke.wav --guitar-db=-12 --format mp3 --out smoke_out.mp3
          test -s smoke_out.mp3

      # Level 1: torch and Qt libraries halve, weights barely shrink. Higher levels save ~5% for 4x the time.
      - name: pack
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            (cd dist && 7z a -tzip -mx=1 "../${{ matrix.name }}.zip" Count-In > /dev/null)
          else
            ditto -c -k --zlibCompressionLevel 1 --keepParent dist/Count-In.app "${{ matrix.name }}.zip"
          fi

      # Uploaded as-is, so the artifact is the release zip itself rather than a zip inside a zip.
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ matrix.name }}.zip
          archive: false
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.name }}.zip
