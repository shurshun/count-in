name: build

# PRs check every code change; tags publish a release. Docs-only changes skip the build.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

jobs:
  # A PR that only bumps the version needs no new bundles: the tag build makes the release ones.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build: ${{ steps.diff.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        run: |
          other=$(git diff -U0 "origin/$GITHUB_BASE_REF...HEAD" -- . ':!*.md' ':!docs/' \
            | grep -E '^[-+]' | grep -vE '^(\+\+\+|---) ' | grep -vE '^[-+]version = "[^"]+"$' || true)
          echo "build=$([ -n "$other" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  build:
    needs: changes

    # Tags and manual runs skip the check and always build; a failed check builds too.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.build == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Count-In-windows-x64
            cli: dist/Count-In/countin
          - os: macos-latest
            name: Count-In-macos-arm64
            cli: dist/Count-In.app/Contents/MacOS/countin
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # A tag must match the version the update check compares against.
      - name: tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME, pyproject $v" >&2; exit 1; }
      - uses: astral-sh/setup-uv@v10.3.3  # setup-uv publishes exact version tags only
        with:
          enable-cache: true

      # LGPL builds only: libmp3lame is LGPL, nothing GPL goes into the bundle.
      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: |
          # Dated build pinned by hash. BtbN prunes old autobuilds; on a 404 move to a newer one and update both lines.
          curl -fsSL -o ff.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-11-13-12-43/ffmpeg-n8.1.3-35-gf1acb0a266-win64-lgpl-8.1.zip
          echo "ea5e260eb3d669aff29e7bfc100e0ed9ea633e37f02fee358f6d164cb946e421  ff.zip" | sha256sum -c -
          7z x -y ff.zip > /dev/null
          mkdir -p bin
          cp ffmpeg-*/bin/ffmpeg.exe ffmpeg-*/bin/ffprobe.exe bin/
          cp ffmpeg-*/LICENSE.txt bin/FFMPEG-LICENSE.txt
          bin/ffmpeg.exe -hide_banner -encoders | grep -q libmp3lame
      - name: ffmpeg cache (macOS)
        if: runner.os == 'macOS'
        id: ffmpeg-cache
        uses: actions/cache@v6
        with:
          path: bin
          key: ffmpeg-macos-${{ hashFiles('packaging/build_ffmpeg.sh') }}
      - name: ffmpeg (macOS)
        if: runner.os == 'macOS' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: brew install lame mpg123 && packaging/build_ffmpeg.sh

      - run: uv sync --locked
      - run: uv run pytest -m 'not slow' -q

      - uses: actions/cache@v6
        with:
          path: models
          key: models-${{ hashFiles('packaging/fetch_models.sh') }}
      - run: packaging/fetch_models.sh

      - run: uv run pyinstaller packaging/countin.spec --noconfirm --distpath dist --workpath build/work

      # Smoke test of the shipped bundle: 20 s of clicks at 120 BPM through detection, separation and mp3 export.
      - name: smoke test
        run: |
          uv run python -c "import numpy as np, soundfile as sf; sr=44100; x=np.zeros((20*sr,2),np.float32); [x.__setitem__(slice(int(t*sr),int(t*sr)+400), 0.8) for t in np.arange(1,20,0.5)]; sf.write('smoke.wav', x, sr)"
          ${{ matrix.cli }} --version

          # A real HTTPS request from the bundle. An HTTP error such as the shared runner IP hitting
          # the API rate limit still proves TLS works; certificate and network errors fail the step.
          out=$(${{ matrix.cli }} --check-update 2>&1) || grep -q "HTTP Error" <<<"$out"
          echo "$out"

          ${{ matrix.cli }} smoke.wav --guitar-db=-12 --format mp3 --out smoke_out.mp3
          test -s smoke_out.mp3

      # The app itself: starts offscreen with the bundled Qt plugins, icons and PortAudio, then quits.
      - name: smoke test (app)
        env:
          QT_QPA_PLATFORM: offscreen
          COUNTIN_SMOKE: "1"
        run: |
          if [ "$RUNNER_OS" = Windows ]; then dist/Count-In/Count-In; else dist/Count-In.app/Contents/MacOS/Count-In; fi

      # Level 1: torch and Qt libraries halve, weights barely shrink. Higher levels save ~5% for 4x the time.
      - name: pack
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            (cd dist && 7z a -tzip -mx=1 "../${{ matrix.name }}.zip" Count-In > /dev/null)
          else
            ditto -c -k --zlibCompressionLevel 1 --keepParent dist/Count-In.app "${{ matrix.name }}.zip"
          fi

      # Uploaded as-is, so the artifact is the release zip itself rather than a zip inside a zip.
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ matrix.name }}.zip
          archive: false

  release:
    # On a tag the changes check is skipped, and a skipped ancestor would skip this job too; check build directly.
    if: ${{ !cancelled() && needs.build.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          skip-decompress: true
      - uses: softprops/action-gh-release@v3
        with:
          files: "*.zip"
          fail_on_unmatched_files: true
